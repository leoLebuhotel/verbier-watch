name: Verbier watcher

on:
  schedule:
    - cron: "*/5 * * * *"   # minimum GitHub ; en pratique toutes les 5-15 min
  workflow_dispatch:
    inputs:
      test_push:
        description: "Envoyer une notif de test"
        type: boolean
        default: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: python3 check.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_PUSH: ${{ inputs.test_push && '1' || '0' }}
